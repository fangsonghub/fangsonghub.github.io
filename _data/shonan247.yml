# ============================================================
#themes:
#  - title: "Quantum distributed computing"
#    body: >
#      Since the first evidence that quantum distributed algorithms can beat
#      classical ones, the area has grown quickly, with recent results
#      demonstrating their potential in the fundamental LOCAL model. We aim to
#      survey these developments, look for further separations, and clarify the
#      limits of quantum distributed computing through its connections to
#      two-party quantum communication complexity.
#
#  - title: "Quantum learning algorithms"
#    body: >
#      Learning the properties of a quantum system is among the most fundamental
#      problems in the field, and the last few years have brought a surge of
#      progress on shallow circuits, Pauli channels, stabilizer states, and more.
#      New mathematical tools have come with it, notably Pauli analysis. We will
#      lay out the fundamentals and the open directions, drawing on computer
#      science, mathematics, information theory, and physics.
#
#  - title: "Quantum cryptography"
#    body: >
#      Two developments anchor this thread: the first provably secure
#      construction of pseudorandom unitaries, and a way of turning quantum
#      advantage experiments on NISQ devices into a basis for cryptographic
#      primitives. We will look for pseudorandom unitaries with new properties
#      and further applications, and examine the new advantage-based assumptions
#      from both a cryptanalytic and a constructive angle.

